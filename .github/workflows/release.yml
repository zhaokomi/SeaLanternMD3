name: 构建发布
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.2)"
        required: true
        default: "v1.2.2"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: 编译并发布 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx vite build
      - run: cargo build --release
        working-directory: src-tauri
      - name: 打包
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          EXE_NAME="SeaLanternMD3-${VERSION}-windows.exe"
          ZIP_NAME="SeaLanternMD3-${VERSION}-windows.zip"
          cp "target/release/sea-lantern.exe" "./${EXE_NAME}"
          7z a "./${ZIP_NAME}" "./${EXE_NAME}" ./README.md ./LICENSE
          echo "EXE_NAME=${EXE_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "SeaLanternMD3 v${{ env.TAG }}"
          body: |
            ## SeaLanternMD3 v${{ env.TAG }}
            自动构建发布。
          files: |
            ${{ env.EXE_NAME }}
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false