name: 构建发布
permissions: { contents: write }
on:
  workflow_dispatch:
    inputs:
      tag: { description: "tag (e.g. v1.2.5)", required: true, default: "v1.2.5" }
  push:
    tags: [ "v*" ]
jobs:
  build:
    name: 构建 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "lts/*" }
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm tauri build
      - name: 打包
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${TAG#v}"; E="SeaLanternMD3-${V}-windows.exe"; Z="SeaLanternMD3-${V}-windows.zip"
          cp "$(find . -name 'sea-lantern.exe' -path '*/release/*' | head -1)" "./$E"
          7z a "./$Z" "./$E" ./README.md ./LICENSE
          echo "EXE_NAME=$E" >> "$GITHUB_ENV"; echo "ZIP_NAME=$Z" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "SeaLanternMD3 v${{ env.TAG }}"
          body: "自动构建发布。"
          files: "${{ env.EXE_NAME }}\n${{ env.ZIP_NAME }}"
          draft: false
          prerelease: false