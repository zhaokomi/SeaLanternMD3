name: 构建发布
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.4)"
        required: true
        default: "v1.2.4"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: 编译并发布 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: 编译 Tauri
        run: pnpm tauri build
      - name: 查找并打包
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          EXE_NAME="SeaLanternMD3-${VERSION}-windows.exe"
          ZIP_NAME="SeaLanternMD3-${VERSION}-windows.zip"
          EXE=$(find . -name "sea-lantern.exe" -path "*/release/*" 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then echo "❌ 找不到 sea-lantern.exe" && exit 1; fi
          cp "$EXE" "./${EXE_NAME}"
          7z a "./${ZIP_NAME}" "./${EXE_NAME}" ./README.md ./LICENSE
          echo "EXE_NAME=${EXE_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "SeaLanternMD3 v${{ env.TAG }}"
          body: |-
            ## SeaLanternMD3 v${{ env.TAG }}
            自动构建发布。
          files: |-
            ${{ env.EXE_NAME }}
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false